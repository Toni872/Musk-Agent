name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

      # The gate. tests/eval.test.ts asserts the retrieval floors (0 false
      # positives, 0 guard violations, exact routing of the forbidden topics,
      # coverage of the approved FAQ) on top of the rule and reception suites.
      - name: Tests
        run: npm test

      # Report only, kept in the log for the record: the eval CLI always exits 0,
      # so the floors are enforced by the test above, not by this command.
      - name: Retrieval report
        run: npm run eval

      # The public bundle is a static artifact: deployment protection is the only
      # thing that hides it. This gate watches one signal only: a committed .env
      # file (real configuration in the repository), so the notification arrives
      # before the next publish instead of after it. Content sign-off is tracked
      # manually in docs/checklist-canal-real.md, not by this gate. See section 9.
      - name: Pilot gate (bundle exposure)
        run: npm run pilot-gate

      - name: Build browser simulator
        run: npm run build:ui

      # api/rephrase.js is a generated, self-contained bundle of src/api-entry.ts.
      # Vercel keeps relative import specifiers verbatim when it compiles api/*.ts,
      # and Node's ESM loader cannot resolve them without an extension at runtime.
      # Shipping the bundle avoids that failure; this step keeps it from drifting.
      - name: API bundle is up to date
        run: npm run build:api && git diff --exit-code -- api/rephrase.js
